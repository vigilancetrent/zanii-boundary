{
  "name": "agent-runtime-distributed",
  "services": {
    "agent": {
      "image": "${RUNTIME_IMAGE:?Set a verified digest-pinned product image}",
      "user": "10003:2000",
      "entrypoint": [
        "node"
      ],
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 64,
      "mem_limit": "256m",
      "cpus": 0.5,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=16m,mode=1770,uid=10003,gid=2000"
      ],
      "environment": {
        "NODE_ENV": "production"
      },
      "stop_grace_period": "10s",
      "network_mode": "none",
      "stdin_open": true,
      "command": [
        "scripts/agent-runner.mjs",
        "--socket",
        "/run/runtime/gateway.sock",
        "--token-file",
        "/run/identity/agent.jwt",
        "--cert-file",
        "/run/identity/agent-cert.pem",
        "--key-file",
        "/run/identity/agent-key.pem",
        "--ca-file",
        "/run/identity/ca.pem"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${RUNTIME_SOCKET_DIR:?}",
          "target": "/run/runtime",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${RUNTIME_AGENT_IDENTITY_DIR:?}",
          "target": "/run/identity",
          "read_only": true
        }
      ]
    },
    "relay": {
      "image": "${RUNTIME_IMAGE:?Set a verified digest-pinned product image}",
      "user": "10004:2000",
      "entrypoint": [
        "node"
      ],
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "mem_limit": "512m",
      "cpus": 1,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=16m,mode=1770,uid=10004,gid=2000"
      ],
      "environment": {
        "NODE_ENV": "production"
      },
      "stop_grace_period": "30s",
      "command": [
        "scripts/relay.mjs",
        "--config",
        "/run/config/relay.json"
      ],
      "networks": [
        "ingress"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "${RUNTIME_CONFIG_DIR:?}/relay.json",
          "target": "/run/config/relay.json",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${RUNTIME_SOCKET_DIR:?}",
          "target": "/run/runtime",
          "read_only": false
        }
      ]
    },
    "gateway": {
      "image": "${RUNTIME_IMAGE:?Set a verified digest-pinned product image}",
      "user": "10001:2000",
      "entrypoint": [
        "node"
      ],
