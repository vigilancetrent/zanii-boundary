        {
          "type": "bind",
          "source": "${RUNTIME_TRUST_DIR:?}",
          "target": "/run/trust",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "${RUNTIME_STATE_DIR:?}/gateway/logs",
          "target": "/var/log/runtime",
          "read_only": false
        }
      ],
      "secrets": [
        "gateway_tls_key",
        "gateway_tls_cert",
        "gateway_data_key",
        "gateway_audit_key",
        "gateway_keyring",
        "gateway_signing_key",
        "gateway_containment_receipt",
        "gateway_postgres_credentials",
        "gateway_otel_cert",
        "gateway_otel_key"
