[server]
protocol = https
http_port = 3000
cert_file = /run/monitoring/grafana/server-cert.pem
cert_key = /run/monitoring/grafana/server-key.pem
min_tls_version = TLS1.3
[security]
admin_user = $__file{/run/monitoring/grafana/admin.user}
admin_password = $__file{/run/monitoring/grafana/admin.password}
secret_key = $__file{/run/monitoring/grafana/encryption.key}
cookie_secure = true
cookie_samesite = strict
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
[analytics]
reporting_enabled = false
check_for_updates = false
