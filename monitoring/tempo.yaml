{
  "target": "all",
  "server": {
    "http_listen_port": 3200,
    "http_server_read_timeout": "5s",
    "http_server_write_timeout": "10s",
    "http_tls_config": {
      "cert_file": "/run/monitoring/tempo/server-cert.pem",
      "key_file": "/run/monitoring/tempo/server-key.pem",
      "client_auth_type": "RequireAndVerifyClientCert",
      "client_ca_file": "/run/monitoring/tempo/ca.pem"
    },
    "tls_min_version": "VersionTLS13"
  },
  "distributor": {
    "receivers": {
      "otlp": {
        "protocols": {
          "http": {
            "endpoint": "0.0.0.0:4318",
            "tls": {
              "cert_file": "/run/monitoring/tempo/server-cert.pem",
              "key_file": "/run/monitoring/tempo/server-key.pem",
              "client_ca_file": "/run/monitoring/tempo/ca.pem",
              "min_version": "1.3"
            }
          }
        }
      }
    }
  },
  "storage": {
    "trace": {
      "backend": "local",
      "local": {
        "path": "/var/lib/tempo/blocks"
      },
      "wal": {
        "path": "/var/lib/tempo/wal"
      }
    }
  },
  "compactor": {
    "compaction": {
      "block_retention": "168h"
    }
  },
  "usage_report": {
    "reporting_enabled": false
  }
}
